<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meta MCP Prototype</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  #response { margin-top: 1.5rem; padding: 1rem; background: #f5f5f5; border-radius: 4px; white-space: pre-wrap; min-height: 2rem; }
</style>
</head>
<body>
<h1>Meta MCP Prototype</h1>
<form id="query-form">
  <textarea id="query" rows="3" placeholder="Ask about your Meta ads..." required></textarea>
  <button type="submit" id="submit">Submit</button>
</form>
<div id="response"></div>
<script>
const form = document.getElementById("query-form");
const queryEl = document.getElementById("query");
const responseEl = document.getElementById("response");
const submitBtn = document.getElementById("submit");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = queryEl.value.trim();
  if (!query) return;
  submitBtn.disabled = true;
  responseEl.textContent = "Loading...";
  try {
    const res = await fetch("/api/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });
    const data = await res.json();
    responseEl.textContent = data.response ?? JSON.stringify(data);
  } catch (err) {
    responseEl.textContent = "Error: " + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
